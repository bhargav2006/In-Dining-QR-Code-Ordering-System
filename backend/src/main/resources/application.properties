spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-qr-dinein-dontopenpleasebud-3717.i.aivencloud.com:28694/defaultdb?ssl-mode=REQUIRED}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator Health Check Exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- CORS Allowed Origins Configuration ---
# Supports local dev (localhost), Vercel deployments, Netlify, and custom domains.
# Override in production by setting environment variable APP_CORS_ALLOWED_ORIGINS
cors.allowed-origins=http://localhost:[*],http://127.0.0.1:[*],https://*.vercel.app,https://*.netlify.app,*