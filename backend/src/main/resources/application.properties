spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HikariCP Connection Pool Optimization for Superfast Performance ---
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000

# Hibernate Performance Optimization (Prevents N+1 Query Overhead)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Actuator Health Check Exposure
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# --- CORS Allowed Origins Configuration ---
cors.allowed-origins=http://localhost:[*],http://127.0.0.1:[*],https://*.vercel.app,https://*.netlify.app,*